<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
  />
  <meta name="theme-color" content="#8b5cf6" />
  <meta name="description" content="Panel de riego automatizado con NodeMCU + Firebase" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <title>Riego IoT — Percepción</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="blob blob-uno" aria-hidden="true"></div>
  <div class="blob blob-dos" aria-hidden="true"></div>

  <div class="contenedor">
    <header class="marca">
      <span class="brote" aria-hidden="true">🌱</span>
      <h1>Riego IoT</h1>
      <div class="expandir"></div>
      <span class="estado-conexion" id="estado-conexion" role="status" aria-live="polite">
        <span class="punto-vivo" aria-hidden="true"></span>
        <span id="texto-conexion">Conectando…</span>
      </span>
      <button class="secundario" id="btn-salir">Salir</button>
    </header>

    <nav class="nav-principal" aria-label="Secciones">
      <a href="index.html" class="activa" aria-current="page">Percepción</a>
      <a href="procesamiento.html">Procesamiento</a>
      <a href="aplicacion.html">Aplicación</a>
    </nav>

    <section class="tarjeta" aria-labelledby="titulo-percepcion">
      <h2 id="titulo-percepcion">Percepción</h2>
      <div class="rejilla-estado">
        <div class="metrica">
          <span class="icono" role="img" aria-label="Temperatura">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a2 2 0 0 0-2 2v9.34a4 4 0 1 0 4 0V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="18" r="2.2"/></svg>
          </span>
          <div class="valor" id="v-temp">—</div>
          <div class="etiqueta">Temperatura °C</div>
        </div>
        <div class="metrica">
          <div class="anillo" id="anillo-aire" role="meter" aria-label="Humedad del aire" aria-valuemin="0" aria-valuemax="100">
            <div class="anillo-centro">
              <span class="anillo-valor" id="v-hum-aire">—</span>
              <span class="anillo-unidad">%</span>
            </div>
          </div>
          <div class="etiqueta">Humedad aire</div>
        </div>
        <div class="metrica">
          <div class="anillo" id="anillo-suelo" role="meter" aria-label="Humedad del suelo" aria-valuemin="0" aria-valuemax="100">
            <div class="anillo-centro">
              <span class="anillo-valor" id="v-hum-suelo">—</span>
              <span class="anillo-unidad">%</span>
            </div>
          </div>
          <div class="etiqueta">Humedad suelo</div>
        </div>
        <div class="metrica">
          <span class="icono" role="img" aria-label="Luz">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
          </span>
          <div class="valor" id="v-luz">—</div>
          <div class="etiqueta">Luz (lux)</div>
        </div>
      </div>
      <p class="v-actualizado" id="v-actualizado" aria-live="polite"></p>
    </section>

    <footer class="pie">Datos vía Firebase Realtime Database, sincronizados por el bridge local.</footer>
  </div>

  <script type="module" src="js/inicio.js"></script>
</body>
</html>
